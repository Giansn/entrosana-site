# Build Astro and publish to GitHub Pages (backup/preview origin).
# entrosana.com itself is served elsewhere — this does not touch it.
name: pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The project page lives under /entrosana-site/ (no custom domain), so
      # the build needs that base path or every asset and link 404s.
      # configure-pages reports it ("" once a custom domain is set).
      - id: pages
        uses: actions/configure-pages@v5
      - run: pnpm build
        env:
          ASTRO_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
